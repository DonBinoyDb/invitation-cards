<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCFAF5" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E1C68E"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <style>@font-face { font-family: "Great Vibes"; src: url(data:font/woff2;charset=utf-8;base64,) format("woff2"); }</style>

  <!-- Brand Light Background -->
  <rect width="512" height="512" fill="#FDFBF7" />

  <!-- Elegant Fine-Line Geometric Frame -->
  <g stroke="#B89745" fill="none">
    <!-- Delicate Double Ring -->
    <circle cx="256" cy="256" r="220" stroke-width="2" />
    <circle cx="256" cy="256" r="205" stroke-width="1" opacity="0.6" />
    
    <!-- Minimalist Compass Points -->
    <line x1="256" y1="20" x2="256" y2="50" stroke-width="2" />
    <line x1="256" y1="462" x2="256" y2="492" stroke-width="2" />
    <line x1="20" y1="256" x2="50" y2="256" stroke-width="2" />
    <line x1="462" y1="256" x2="492" y2="256" stroke-width="2" />
    
    <!-- Tiny Diamond Accents -->
    <polygon points="256,15 261,20 256,25 251,20" fill="#B89745" stroke="none" />
    <polygon points="256,487 261,492 256,497 251,492" fill="#B89745" stroke="none" />
    <polygon points="15,256 20,261 25,256 20,251" fill="#B89745" stroke="none" />
    <polygon points="487,256 492,261 497,256 492,251" fill="#B89745" stroke="none" />
  </g>

  <!-- Central Elegant 'K' -->
  <text x="220" y="265" font-family="'Great Vibes', cursive" font-size="220" font-weight="400" font-style="normal" fill="#111111" text-anchor="middle" dominant-baseline="middle">K</text>
</svg>
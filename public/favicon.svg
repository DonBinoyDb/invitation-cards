<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand Dark Background (Slightly rounded app-icon style) -->
  <rect width="512" height="512" rx="112" fill="#111111" />
  
  <!-- Invite Card pulling out (Solid Gold) -->
  <rect x="136" y="112" width="240" height="200" rx="16" fill="#B89745" />
  
  <!-- Simple Heart on the Card (Dark) -->
  <path d="M 256,168 C 240,150 210,155 218,180 C 226,205 256,228 256,228 C 256,228 286,205 294,180 C 302,155 272,150 256,168 Z" fill="#111111" />
  
  <!-- Envelope Body (Dark with Gold Outline) -->
  <path d="M 96,216 L 96,384 C 96,401.6 110.4,416 128,416 L 384,416 C 401.6,416 416,401.6 416,384 L 416,216 Z" fill="#111111" stroke="#B89745" stroke-width="32" stroke-linejoin="round" />
  
  <!-- Envelope Front Flaps (Gold Lines) -->
  <path d="M 96,216 L 256,336 L 416,216" fill="none" stroke="#B89745" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 96,416 L 208,300" fill="none" stroke="#B89745" stroke-width="32" stroke-linecap="round" />
  <path d="M 416,416 L 304,300" fill="none" stroke="#B89745" stroke-width="32" stroke-linecap="round" />
  
  <!-- Little Wax Seal at the center intersection -->
  <circle cx="256" cy="336" r="32" fill="#111111" />
  <circle cx="256" cy="336" r="20" fill="#B89745" />
</svg>